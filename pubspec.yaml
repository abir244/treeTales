name: tree_tales
description: "TreeTales - Stories of Trees, Forests & Nature"
publish_to: 'none' # Private project, not for pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2

  # Riverpod state management
  flutter_riverpod: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    # Add more images later as needed
